
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام دخول زفاف أسامة وريم</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{font-family:Arial;background:#f4f1eb;margin:0;padding:20px;color:#222}
main{max-width:480px;margin:25px auto;background:white;padding:22px;border-radius:18px;box-shadow:0 4px 20px #0001}
h2{text-align:center;color:#80652e}
input,button{width:100%;box-sizing:border-box;padding:14px;margin:8px 0;border-radius:9px;font-size:17px}
input{border:1px solid #ccc}
button{background:#80652e;color:white;border:0;font-weight:bold}
#reader{width:100%;margin-top:15px}
#message{text-align:center;font-size:20px;font-weight:bold;margin:18px 0}
.stats{display:flex;justify-content:space-around;text-align:center;margin:18px 0}
.stats strong{display:block;font-size:25px;color:#80652e}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h2>زفاف أسامة وريم</h2>
<div id="login">
<p>تسجيل دخول المنظم</p>
<input id="password" type="password" placeholder="كلمة مرور المنظم">
<button onclick="login()">دخول</button>
</div>
<div id="panel" class="hidden">
<div class="stats">
<div>الإجمالي<strong id="total">300</strong></div>
<div>دخلوا<strong id="entered">0</strong></div>
<div>المتبقي<strong id="remaining">300</strong></div>
</div>
<button onclick="startScanner()">تشغيل الكاميرا</button>
<div id="reader"></div>
<div id="message">جاهز لمسح الدعوات</div>
<button onclick="refreshDashboard()">تحديث الإحصائيات</button>
</div>
</main>

<iframe name="apiFrame" id="apiFrame" style="display:none"></iframe>
<form id="apiForm" method="POST" target="apiFrame"
action="https://script.google.com/macros/s/AKfycbxObFWGRsFmVf0wV-lsSncJ7jfol31fxzDnI9O7JvvpIAyVzCAANaBkhqL4ruIHozuz/exec">
<input type="hidden" name="payload" id="payload">
</form>

<script>
let token = "";
let scanner = null;
let busy = false;
let lastCode = "";

function api(data){
 return new Promise((resolve)=>{
  let finished=false;
  const handler=(event)=>{
   if(event.data && event.data.type==="wedding-api-result"){
    finished=true;
    window.removeEventListener("message",handler);
    resolve(event.data.result);
   }
  };
  window.addEventListener("message",handler);
  document.getElementById("payload").value=JSON.stringify(data);
  document.getElementById("apiForm").submit();
  setTimeout(()=>{
   if(!finished){
    window.removeEventListener("message",handler);
    resolve("تعذر الاتصال بالنظام");
   }
  },15000);
 });
}

async function login(){
 const password=document.getElementById("password").value;
 if(!password){alert("أدخل كلمة المرور");return;}
 const result=await api({action:"login",password});
 if(typeof result==="string" && result.length>20){
  token=result;
  document.getElementById("login").classList.add("hidden");
  document.getElementById("panel").classList.remove("hidden");
  refreshDashboard();
 }else{
  alert(typeof result==="string"?result:"تعذر تسجيل الدخول");
 }
}

async function startScanner(){
 if(!token){alert("سجل الدخول أولاً");return;}
 if(scanner)return;
 scanner=new Html5Qrcode("reader");
 try{
  await scanner.start(
   {facingMode:"environment"},
   {fps:10,qrbox:{width:250,height:250}},
   async(decodedText)=>{
    if(busy || decodedText===lastCode)return;
    busy=true;
    lastCode=decodedText;
    document.getElementById("message").textContent="جارٍ التحقق...";
    const result=await api({action:"check",code:decodedText,token});
    document.getElementById("message").textContent=
      typeof result==="string"?result:JSON.stringify(result);
    if(typeof result==="string" && result.includes("مستخدمة")){
      document.getElementById("message").style.color="red";
    }else{
      document.getElementById("message").style.color="green";
    }
    await refreshDashboard();
    setTimeout(()=>{busy=false;lastCode="";},2500);
   },
   ()=>{}
  );
 }catch(e){
  scanner=null;
  document.getElementById("message").textContent="تعذر تشغيل الكاميرا. اسمح بالوصول للكاميرا.";
 }
}

async function refreshDashboard(){
 const result=await api({action:"dashboard",token});
 if(result && typeof result==="object"){
  document.getElementById("total").textContent=result.total;
  document.getElementById("entered").textContent=result.entered;
  document.getElementById("remaining").textContent=result.remaining;
 }
}
</script>
</body>
</html>
